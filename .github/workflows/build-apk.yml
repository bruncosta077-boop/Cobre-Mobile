name: Build APK

on:
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: Build a signed APK/AAB for device testing without publishing a release
        type: boolean
        required: false
        default: false
  push:
    branches: [main, 'codex/**']
    tags: ['mobile-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Prepare stable release signing
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        env:
          COBRE_MOBILE_KEYSTORE_BASE64: ${{ secrets.COBRE_MOBILE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$COBRE_MOBILE_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the Cobre Mobile release-signing secrets before creating a release tag."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/cobre-mobile-release.jks"
          printf '%s' "$COBRE_MOBILE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "COBRE_MOBILE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle testDirectDebugUnitTest --no-daemon

      - name: Build debug APK for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/mobile-v') && !inputs.signed_candidate }}
        run: gradle assembleDirectDebug bundlePlayRelease --no-daemon

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        env:
          COBRE_MOBILE_STORE_PASSWORD: ${{ secrets.COBRE_MOBILE_STORE_PASSWORD }}
          COBRE_MOBILE_KEY_ALIAS: ${{ secrets.COBRE_MOBILE_KEY_ALIAS }}
          COBRE_MOBILE_KEY_PASSWORD: ${{ secrets.COBRE_MOBILE_KEY_PASSWORD }}
        run: |
          if [ -z "$COBRE_MOBILE_STORE_PASSWORD" ] || [ -z "$COBRE_MOBILE_KEY_ALIAS" ] || [ -z "$COBRE_MOBILE_KEY_PASSWORD" ]; then
            echo "::error::One or more Cobre Mobile release-signing secrets are missing."
            exit 1
          fi
          gradle assembleDirectRelease bundlePlayRelease --no-daemon

      - name: Verify signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android SDK build-tools apksigner was not found."
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/direct/release/app-direct-release.apk

      - name: Verify signed Play Store bundle
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        run: jarsigner -verify -verbose app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: Stage release artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        run: |
          if [[ "$GITHUB_REF_NAME" == mobile-v* ]]; then
            version="${GITHUB_REF_NAME#mobile-v}"
          else
            version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not determine the Cobre Mobile version."
            exit 1
          fi
          mkdir -p release-output
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "release-output/Cobre-Mobile-${version}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "release-output/Cobre-Mobile-${version}.aab"

      - name: Generate release artifact checksums
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        shell: bash
        run: |
          sha256sum release-output/Cobre-Mobile-*.apk release-output/Cobre-Mobile-*.aab > release-output/checksums-sha256.txt

      - name: Upload debug artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/mobile-v') && !inputs.signed_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: cobre-mobile-debug-apk
          path: |
            app/build/outputs/apk/direct/debug/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
      - name: Upload signed release artifact
        if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') || inputs.signed_candidate }}
        uses: actions/upload-artifact@v7
        with:
          name: cobre-mobile-release-artifacts
          path: release-output/*
          if-no-files-found: error

  publish-apk:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: cobre-mobile-release-artifacts
          path: release

      - name: Preparar arquivo instalável
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          sha256sum "release/Cobre-Mobile-${version}.apk" > "release/Cobre-Mobile-${version}.apk.sha256"
          sha256sum "release/Cobre-Mobile-${version}.aab" > "release/Cobre-Mobile-${version}.aab.sha256"

      - name: Preparar notas desta versão
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          version = os.environ['GITHUB_REF_NAME'].removeprefix('mobile-v')
          changelog = open('CHANGELOG.md', encoding='utf-8').read()
          match = re.search(r'^##\s+' + re.escape(version) + r'[^\n]*\n(.*?)(?=^##\s|\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit(f'Notas da versão {version} não encontradas em CHANGELOG.md')
          notes = match.group(1).strip()
          notes += '\n\nAPK para instalação direta e Android App Bundle (AAB) assinados com a chave estável de distribuição do Cobre Mobile.'
          if version == '0.12.0':
              notes += '\n\n**Migração única:** esta é a primeira versão com a chave estável. APKs anteriores assinados pelo modo de depuração podem exigir exportar o backup do app, desinstalar a versão antiga e instalar esta. Após migrar, as próximas versões com esta chave atualizam por cima e preservam os dados.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          PY

      - name: Publicar APK para instalação Android
        uses: softprops/action-gh-release@v2
        with:
          name: Cobre Mobile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body_path: release-notes.md
          files: |
            release/Cobre-Mobile-*.apk
            release/Cobre-Mobile-*.apk.sha256
            release/Cobre-Mobile-*.aab
            release/Cobre-Mobile-*.aab.sha256
