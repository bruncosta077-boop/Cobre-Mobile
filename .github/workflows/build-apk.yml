name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['mobile-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: cobre-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish-apk:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cobre-mobile-debug-apk
          path: release

      - name: Preparar arquivo instalável
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          mv release/app-debug.apk "release/Cobre-Mobile-${version}.apk"

      - name: Publicar APK para instalação Android
        uses: softprops/action-gh-release@v2
        with:
          name: Cobre Mobile ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          body: |
            APK de teste do Cobre Mobile, compilado pelo GitHub Actions.

            Baixe o arquivo APK anexado no Android e toque nele para instalar. O Android pode pedir autorização para instalar apps desta origem.

            Esta é uma compilação de desenvolvimento, não uma versão da Play Store. A validação da reprodução e das medições de stream deve ser feita no aparelho.
          files: release/Cobre-Mobile-*.apk
